name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CODEX_RAW_BASE: https://raw.githubusercontent.com/mtg-r-brain/rbrain-codex/main

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

      - name: Pytest
        run: uv run pytest

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Fetch and run validate-repo
        run: |
          curl -fsSL "$CODEX_RAW_BASE/scripts/validate-repo.sh" -o /tmp/validate-repo.sh
          bash /tmp/validate-repo.sh .
