name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CODEX_RAW_BASE: https://raw.githubusercontent.com/mtg-r-brain/rbrain-codex/main

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cargo build
        run: cargo build --locked

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Fetch and run validate-repo
        run: |
          curl -fsSL "$CODEX_RAW_BASE/scripts/validate-repo.sh" -o /tmp/validate-repo.sh
          bash /tmp/validate-repo.sh .
