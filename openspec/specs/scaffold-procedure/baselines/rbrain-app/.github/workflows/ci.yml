name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CODEX_RAW_BASE: https://raw.githubusercontent.com/mtg-r-brain/rbrain-codex/main

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm tsc:check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Fetch and run validate-repo
        run: |
          curl -fsSL "$CODEX_RAW_BASE/scripts/validate-repo.sh" -o /tmp/validate-repo.sh
          bash /tmp/validate-repo.sh .
