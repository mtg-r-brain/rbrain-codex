[project]
name = "rbrain-cortex"
version = "0.1.0"
description = "Orchestrates LLM agents, conversations, and tool invocations across lexicon, oracle, and forge."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Hoani Cross", email = "hoani.cross@gmail.com" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "structlog>=24.4",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
